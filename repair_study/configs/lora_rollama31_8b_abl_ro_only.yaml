# RoLlama3.1-8B-DPO, repair-corpus ablation: ro_only.
#
# Romanian only -- the English slice removed, the rest rescaled to keep the
# corpus at 4,000 records. Isolates one question: is the 25% English replay
# load-bearing, or is it insurance we are paying for without evidence?
# The recipe predicts it matters (monolingual tuning is what degrades format
# adherence in the first place); this is the run that checks.
#
# Same model, same hyperparameters, same 4,000-record budget as
# lora_rollama31_8b_v2.yaml. The mix weights are the only difference,
# so any change in the scores is attributable to the corpus composition.

base_model: OpenLLM-Ro/RoLlama3.1-8b-Instruct-DPO-2025-04-23

data:
  mix:
    - path: data/sft/track_a.jsonl
      weight: 0.4
    - path: data/sft/track_b_invoice.jsonl
      weight: 0.0833333
    - path: data/sft/track_b_contract.jsonl
      weight: 0.0833333
    - path: data/sft/track_b_anunt.jsonl
      weight: 0.0833333
    - path: data/sft/track_c.jsonl
      weight: 0.35
    - path: data/sft/english_structured.jsonl
      weight: 0.0
  max_seq_len: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # NOTE: train_lora.py ignores this list and uses its hardcoded
  # TARGET_MODULE_PATTERN. Kept here for documentation only — editing it has no
  # effect. Verify print_trainable_parameters() is non-zero before trusting any
  # run, and especially before porting to a non-Llama family.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 2
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch_size: 2
  gradient_accumulation: 8
  bf16: true
  seed: 0
  # Mask the prompt: loss on the completion only. The completion is now
  # explanation + JSON, so the explanation is trained too — that is the point.
  train_on_inputs: false

eval:
  # Held-out external, via the pinned rombench harness. The comparison that
  # matters is against the 32.0% valid-JSON baseline on the SAME dual-channel
  # protocol; never against a JSON-only number.
  gmtw_ro: true
  native_extraction: eval/native_extraction
