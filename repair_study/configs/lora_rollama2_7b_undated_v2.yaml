# RoLlama2-7b-Instruct on the datagen/ corpus -- the UNDATED checkpoint.
#
# Same recipe as lora_rollama2_7b_v2.yaml; the base model is the only change,
# and it is the reason this file exists.
#
# `OpenLLM-Ro/RoLlama2-7b-Instruct` and `...-2024-10-09` are DIFFERENT weights.
# Every other family in this study aliases (checked against the Hub: the
# safetensors sha256 of the undated and dated repos match for Mistral, Llama3,
# Llama3.1 and Gemma2, both stages). RoLlama2 is the sole exception.
#
# The team's harness (gmtw-hria/run_all.sh) names the undated repo and pins no
# revision, so the undated weights are the ones every published baseline was
# measured on. Training the dated release gave us a row that could not be
# compared to anything -- the 61.4 vs 84.0 baseline gap that kept this family
# pinned. This config is the comparable one; keep the other for provenance.

base_model: OpenLLM-Ro/RoLlama2-7b-Instruct

data:
  mix:
    - path: data/sft/track_a.jsonl
      weight: 0.30
    - path: data/sft/track_b_invoice.jsonl
      weight: 0.0625
    - path: data/sft/track_b_contract.jsonl
      weight: 0.0625
    - path: data/sft/track_b_anunt.jsonl
      weight: 0.0625
    # datagen/track_c.py — the selection family. Named track_c.jsonl here,
    # where the old config said track_c_select.jsonl; there is only one Track C
    # now, so the qualifier no longer distinguishes anything.
    - path: data/sft/track_c.jsonl
      weight: 0.2625
    - path: data/sft/english_structured.jsonl   # retained-capability slice
      weight: 0.25
  max_seq_len: 4096

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  # NOTE: train_lora.py ignores this list and uses its hardcoded
  # TARGET_MODULE_PATTERN. Kept here for documentation only — editing it has no
  # effect. Verify print_trainable_parameters() is non-zero before trusting any
  # run, and especially before porting to a non-Llama family.
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

train:
  epochs: 2
  lr: 1.0e-4
  scheduler: cosine
  warmup_ratio: 0.03
  per_device_batch_size: 2
  gradient_accumulation: 8
  bf16: true
  seed: 0
  # Mask the prompt: loss on the completion only. The completion is now
  # explanation + JSON, so the explanation is trained too — that is the point.
  train_on_inputs: false

eval:
  # Held-out external, via the pinned rombench harness. The comparison that
  # matters is against the 32.0% valid-JSON baseline on the SAME dual-channel
  # protocol; never against a JSON-only number.
  gmtw_ro: true
  native_extraction: eval/native_extraction
